[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yandex-music-linux"
version = "1.0.0"
description = "Native Linux desktop client for Yandex Music (PySide6 + libmpv, no Electron)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yandex Music Linux Contributors" }]
keywords = [
    "yandex",
    "music",
    "linux",
    "qt",
    "pyside6",
    "mpv",
    "libmpv",
    "mpris",
    "dbus",
]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "PySide6>=6.6",
    "python-mpv>=1.0.5",
    "yandex-music>=3.0",
    "numpy>=1.26",
    "keyring>=24.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "build>=1.0",
    "pytest>=8.0",
]

[project.scripts]
yandex-music-native = "ui.app:main"
yandex-music-linux = "ui.app:main"

[project.urls]
Homepage = "https://github.com/arcticlore/yandex-music-native"
Issues = "https://github.com/arcticlore/yandex-music-native/issues"
Changelog = "https://github.com/arcticlore/yandex-music-native/releases"

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "ui*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "auth_test.py"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "build", "dist", "src/yandex_music_linux.egg-info"]

[tool.ruff.lint]
select = ["F", "E9"]
